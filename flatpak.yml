id: com.edde746.plezy
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
  - org.freedesktop.Sdk.Extension.openjdk25
command: plezy
add-extensions:
  org.freedesktop.Platform.VAAPI.Intel:
    directory: lib/intel-vaapi-driver
    version: '25.08'
    autodelete: false
    no-autodownload: true
  org.freedesktop.Platform.GL:
    directory: lib/GL
    version: '25.08'
    versions: 25.08;1.4
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;vulkan/explicit_layer.d;vulkan/implicit_layer.d
    download-if: active-gl-driver
    enable-if: active-gl-driver
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=system-bus
  - --share=network
  - --share=ipc
  - --device=all
  - --talk-name=org.freedesktop.ScreenSaver
cleanup:
  - /bin/cargo-c
  - /bin/cargo-cinstall
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/gtk-doc
  - /share/info
  - /share/man
  - /share/pkgconfig
  - '*.a'
  - '*.la'
modules:
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dvaapi=enabled
      - -Ddrm=enabled
      - -Degl=enabled
      - -Degl-drm=enabled
      - -Dcuda-hwaccel=enabled
      - -Dpulse=enabled
      - -Dalsa=disabled
      - -Duchardet=enabled
      - --libdir=lib
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
    modules:
      - name: hwdata
        buildsystem: simple
        build-commands:
          - ./configure --prefix=/app --libdir=/app/lib --datadir=/app/share
          - make install
        sources:
          - type: git
            url: https://github.com/vcrhonek/hwdata.git
            tag: v0.410
            commit: 8bb6c48dc2e683777e625d1c9ef02c1b25b741cd
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$
      - name: libdisplay-info
        buildsystem: meson
        config-opts:
          - --libdir=lib
        sources:
          - type: git
            url: https://gitlab.freedesktop.org/emersion/libdisplay-info.git
            tag: 0.4.0
            commit: c67a3e9bedb05ab61c7443704a1a107e76254595
            x-checker-data:
              type: git
              tag-pattern: ^([\d.]+)$
      - name: cargo-c
        sources:
          - type: archive
            url: https://github.com/lu-zero/cargo-c/releases/download/v0.10.20/cargo-c-x86_64-unknown-linux-musl.tar.gz
            sha256: 4f886fda551b9105efe6e0abae0f9f0d76da2b7faccf8db2b15f3b680841b3e4
            strip-components: 0
        buildsystem: simple
        build-commands:
          - install -Dm755 cargo-cinstall /app/bin/cargo-cinstall
          - ln -sf /app/bin/cargo-cinstall /app/bin/cargo-c
      - name: libdovi
        buildsystem: simple
        build-options:
          append-path: /usr/lib/sdk/rust-stable/bin
          env:
            CARGO_HOME: /run/build/libdovi/cargo
        sources:
          - type: git
            url: https://github.com/quietvoid/dovi_tool.git
            tag: libdovi-3.4.0
            commit: d1abe0e27ff2c7ab3339614d06db9f8a058af6b2
            x-checker-data:
              type: git
              tag-pattern: ^libdovi-([\d.]+)$
          - cargo-sources/libdovi/libdovi.cargo-sources.json
        build-commands:
          - cd dolby_vision && cargo cinstall --release --features capi --prefix=/app
            --libdir=/app/lib --frozen
      - name: ffnvcodec
        buildsystem: simple
        build-commands:
          - make install PREFIX=/app
        sources:
          - type: git
            url: https://github.com/FFmpeg/nv-codec-headers.git
            tag: n13.1.15.0
            commit: 0a6fba9a2820628b8103464f4c8753ee05838baa
            x-checker-data:
              type: git
              tag-pattern: ^n([\d.]+)$
      - name: ffmpeg
        cleanup:
          - /share/ffmpeg/examples
        config-opts:
          - --enable-shared
          - --disable-static
          - --enable-gnutls
          - --disable-doc
          - --disable-programs
          - --disable-encoders
          - --disable-muxers
          - --enable-encoder=png
          - --enable-vaapi
          - --enable-vdpau
          - --enable-libdrm
          - --enable-ffnvcodec
          - --enable-nvdec
        sources:
          - type: git
            url: https://git.ffmpeg.org/ffmpeg.git
            tag: n9.0.1
            commit: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
            x-checker-data:
              type: git
              tag-pattern: ^n([\d.]+)$
      - name: fribidi
        buildsystem: meson
        config-opts:
          - -Ddocs=false
        sources:
          - type: git
            url: https://github.com/fribidi/fribidi.git
            tag: v1.0.16
            commit: 68162babff4f39c4e2dc164a5e825af93bda9983
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$
      - name: libass
        config-opts:
          - --disable-static
        sources:
          - type: git
            url: https://github.com/libass/libass.git
            tag: 0.17.5
            commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d
            x-checker-data:
              type: git
              tag-pattern: ^([\d.]+)$
      - name: uchardet
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_STATIC=0
          - -DCMAKE_INSTALL_LIBDIR=lib
          - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cleanup:
          - /share/man
        sources:
          - type: git
            url: https://gitlab.freedesktop.org/uchardet/uchardet.git
            tag: v0.0.8
            commit: ae6302a016088ad07177f86d417b20010053632b
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dvulkan=enabled
          - -Dshaderc=enabled
          - -Dlibdovi=enabled
          - -Ddemos=false
          - -Dc_args=-fvisibility=hidden
          - --libdir=lib
        sources:
          - type: git
            url: https://code.videolan.org/videolan/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$
  - name: libevdev
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dtests=disabled
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/libevdev/libevdev.git
        tag: libevdev-1.13.7
        commit: a158f468affb059669189454a52b0d78c563618b
        x-checker-data:
          type: git
          tag-pattern: ^libevdev-([\d.]+)$
  - name: plezy
    buildsystem: simple
    build-options:
      append-path: /var/lib/flutter/bin:/usr/lib/sdk/llvm21/bin:/usr/lib/sdk/openjdk25/jvm/openjdk-25/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib:/usr/lib/sdk/openjdk25/jvm/openjdk-25/lib/server:/usr/lib/sdk/openjdk25/jvm/openjdk-25/lib
      env:
        PUB_CACHE: /run/build/plezy/.pub-cache
        CXX: clang++
        CC: clang
        JAVA_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25
        JDK_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25
        CMAKE_INCLUDE_PATH: /usr/lib/sdk/openjdk25/jvm/openjdk-25/include:/usr/lib/sdk/openjdk25/jvm/openjdk-25/include/linux
        CMAKE_LIBRARY_PATH: /usr/lib/sdk/openjdk25/jvm/openjdk-25/lib/server:/usr/lib/sdk/openjdk25/jvm/openjdk-25/lib
    build-commands:
      - sed -i '1s|^|set(FETCHCONTENT_FULLY_DISCONNECTED ON)\nset(FETCHCONTENT_SOURCE_DIR_SIMDUTF
        "${CMAKE_CURRENT_SOURCE_DIR}/simdutf_local")\nset(FETCHCONTENT_SOURCE_DIR_SQLITE3
        "${CMAKE_CURRENT_SOURCE_DIR}/sqlite3_local")\n|' linux/CMakeLists.txt
      - flutter build linux --release --no-pub --verbose --dart-define=ENABLE_UPDATE_CHECK=false
        --dart-define=ENABLE_SENTRY=false
      - mkdir -p /app/lib/intel-vaapi-driver
      - mkdir -p /app/lib/GL
      - mkdir -p /app/bin
      - mkdir -p /app/opt && cp -r build/linux/x64/release/bundle /app/opt/plezy
      - |
        cat > /app/bin/plezy << 'EOF'
        #!/bin/bash
        cd /app/opt/plezy
        exec ./plezy "$@"
        EOF
      - chmod +x /app/bin/plezy
      - install -Dm644 com.edde746.plezy.desktop /app/share/applications/com.edde746.plezy.desktop
      - install -Dm644 com.edde746.plezy.metainfo.xml /app/share/metainfo/com.edde746.plezy.metainfo.xml
      - install -Dm644 com.edde746.plezy.svg /app/share/icons/hicolor/scalable/apps/com.edde746.plezy.svg
    sources:
      - type: git
        url: https://github.com/edde746/plezy.git
        tag: 2.16.0
        commit: 4cc8b4c0d99d0d8cd6b25c1dcce069ead4937ec0
        x-checker-data:
          type: git
          tag-pattern: ^([\d]+\.[\d]+\.[\d]+)$
      - type: archive
        url: https://github.com/simdutf/simdutf/releases/download/v9.1.0/singleheader.zip
        sha256: 9de890413ccb528f60aa5a327e6340a4dc29f6cdf3673211320df6f3a971ea44
        dest: linux/simdutf_local
        x-checker-data:
          type: json
          url: https://api.github.com/repos/simdutf/simdutf/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="singleheader.zip") | .browser_download_url
      - type: archive
        url: https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz
        sha256: 0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c
        dest: linux/sqlite3_local
        x-checker-data:
          type: html
          url: https://sqlite.org/download.html
          version-pattern: (20\d{2}/sqlite-autoconf-\d+)\.tar\.gz
          url-template: https://sqlite.org/$version.tar.gz
      - type: dir
        path: ./extra/
      - type: patch
        paths:
          - patches/plezy-Wno-error.patch
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.1
        dest: flutter
        x-checker-data:
          type: git
          tag-pattern: ^([\d]+\.[\d]+\.[\d]+)$
        commit: 6655482ec06e547f90abf8ae7590466f4415978d
